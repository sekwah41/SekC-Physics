buildscript {
    repositories {
        gradlePluginPortal()
        mavenCentral()

        maven {
            url = 'https://maven.msrandom.net/repository/cloche'
            metadataSources {
                mavenPom()
                artifact()
            }
        }
    }

    dependencies {
        classpath 'earth.terrarium:cloche:0.18.10'
    }
}

plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
}

apply plugin: 'earth.terrarium.cloche'

group = 'com.sekwah'
version = '0.2.0b1'

base {
    archivesName = 'sekcphysics'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def forge1122ClientExtraJar = layout.buildDirectory.file('minecraft/forge-1.12.2/forge-1.12.2-14.23.5.2864-client-extra.jar')

def ensureForge1122ClientExtraJar = tasks.register('ensureForge1122ClientExtraJar', Jar) {
    archiveFileName = forge1122ClientExtraJar.get().asFile.name
    destinationDirectory = forge1122ClientExtraJar.get().asFile.parentFile
}

tasks.matching { it.name == 'accessWidenForge1122Minecraft' }.configureEach {
    dependsOn(ensureForge1122ClientExtraJar)
}

repositories {
    cloche.librariesMinecraft()

    mavenCentral()

    maven {
        url = 'https://maven.minecraftforge.net'
        metadataSources {
            mavenPom()
            artifact()
        }
    }

    maven {
        url = 'https://maven.neoforged.net/releases'
        metadataSources {
            mavenPom()
            artifact()
        }
    }

    maven {
        url = 'https://repo1.maven.org/maven2'
        metadataSources {
            mavenPom()
            artifact()
        }
    }

    cloche {
        main()
        mavenForge()
    }
}

configurations.configureEach {
    exclude group: 'org.lwjgl.lwjgl', module: 'lwjgl-platform'
    exclude group: 'net.java.jinput', module: 'jinput-platform'

    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.scala-lang.plugins' &&
                details.requested.name == 'scala-continuations-library_2.11' &&
                details.requested.version == '1.0.2_mc') {
            details.useVersion '1.0.2'
        }

        if (details.requested.group == 'org.scala-lang.plugins' &&
                details.requested.name == 'scala-continuations-plugin_2.11.1' &&
                details.requested.version == '1.0.2_mc') {
            details.useVersion '1.0.2'
        }
    }
}

cloche {
    metadata {
        modId = 'sekcphysics'
        name = 'SekC Physics'
        license = 'ARR'
        description = 'Adding realistic physics to mc'
    }

    forge('forge:1.12.2') {
        minecraftVersion = '1.12.2'
        loaderVersion = '14.23.5.2864'

        mappings {
            custom(project.dependencies.create(project.files('gradle/forge1122-mappings.tiny')))
        }

        runs {
            server()
            client()
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
